name: Build FSM RC20 Windows Installers

on:
  workflow_dispatch:
  push:
    branches: [main, feature/ship-office-sync]
    paths:
      - "frontend/**"
      - "backend/**"
      - "installer/**"
      - "native/**"
      - "BUILD_RC20.ps1"
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Test backend vessel source and role visibility
        shell: pwsh
        run: ./scripts/test-role-visibility.ps1

      - name: Test installed-path Office and Ship synchronization
        shell: pwsh
        run: ./scripts/test-synchronization-e2e.ps1

      - name: Test zero-configuration activation and automatic synchronization
        shell: pwsh
        run: ./scripts/test-zero-configuration-sync.ps1

      - name: Build frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location frontend
          npm ci
          npm run build
          Set-Location ..

          $bundle = Get-Content "frontend/dist/assets/*.js" -Raw
          if ($bundle -notmatch "Version RC20") {
            throw "Frontend bundle does not contain Version RC20."
          }
          if ($bundle -notmatch "Synchronization completed") {
            throw "Frontend bundle does not contain the RC20 synchronization UI."
          }
          @(
            "Welcome",
            "Select Vessel",
            "Activation Code",
            "Waiting for Internet",
            "Pending changes",
            "Synchronize Now",
            "Advanced Diagnostics"
          ) | ForEach-Object {
            if ($bundle -notmatch [regex]::Escape($_)) {
              throw "Frontend bundle is missing the RC20-026 zero-configuration experience: $_"
            }
          }
          if ($bundle -notmatch "Add Vessel" -or
              $bundle -notmatch "Create Vessel") {
            throw "Frontend bundle does not contain the vessel creation UI."
          }
          if ($bundle -match "Version RC19") {
            throw "Frontend bundle still contains Version RC19."
          }

          $wwwroot = "backend/src/FSM.Api/wwwroot"
          if (Test-Path $wwwroot) { Remove-Item $wwwroot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $wwwroot | Out-Null
          Copy-Item "frontend/dist/*" $wwwroot -Recurse -Force

      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore backend/src/FSM.Api/FSM.Api.csproj
          dotnet publish backend/src/FSM.Api/FSM.Api.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=false `
            -o publish

          @("Data", "Data/SynchronizationTransfers", "Data/SynchronizationDownloads", "Documents/reports", "Documents/certificates", "Documents/service-requests", "Documents/inspection-reports", "Documents/inspection-attachments", "Backups", "Logs") |
            ForEach-Object { New-Item -ItemType Directory -Force "publish/$_" | Out-Null }

          if (-not (Test-Path "publish/FSM.Api.exe")) {
            throw "FSM.Api.exe was not published."
          }

          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -NoProfile `
            -NonInteractive `
            -ExecutionPolicy Bypass `
            -File ".\native\scripts\build-launcher.ps1" `
            -OutputDirectory "publish"
          if ($LASTEXITCODE -ne 0 -or
              -not (Test-Path "publish/FleetSafetyManagerLauncher.exe")) {
            throw "FleetSafetyManagerLauncher.exe was not created."
          }

          $publishedBundle = Get-Content "publish/wwwroot/assets/*.js" -Raw
          if ($publishedBundle -notmatch "Add Vessel" -or
              $publishedBundle -notmatch "Create Vessel") {
            throw "Published application is missing the vessel creation UI."
          }

          ./scripts/test-desktop-launcher.ps1
          ./scripts/test-local-admin-reset.ps1

          if ($publishedBundle -notmatch "Reset FSM Administrator Password") {
            throw "Published application is missing the local administrator recovery instructions."
          }
          if ($publishedBundle -match "Google app password" -or
              $publishedBundle -match "Send Verification Code") {
            throw "Published application still contains the obsolete Gmail recovery UI."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Office installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyEdition=Office `
            /DOutputBase=FleetSafetyManager_Office_Setup `
            installer/FleetSafetyManager.iss

      - name: Build Ship installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyEdition=Ship `
            /DOutputBase=FleetSafetyManager_Ship_Setup `
            installer/FleetSafetyManager.iss

      - name: Verify installer files
        shell: pwsh
        run: |
          $office = "installer/output/FleetSafetyManager_Office_Setup.exe"
          $ship = "installer/output/FleetSafetyManager_Ship_Setup.exe"
          if (-not (Test-Path $office)) { throw "Office installer is missing." }
          if (-not (Test-Path $ship)) { throw "Ship installer is missing." }
          Get-FileHash $office -Algorithm SHA256
          Get-FileHash $ship -Algorithm SHA256

      - name: Build account-free remote synchronization pilot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = "pilot/output/FSM_Remote_Pilot"
          $toolsRoot = "$packageRoot/RemotePilot"
          New-Item -ItemType Directory -Path $toolsRoot -Force | Out-Null

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/cloudflare/cloudflared/releases/latest" `
            -Headers @{ "User-Agent" = "FleetSafetyManager-Build" }
          $asset = $release.assets | Where-Object {
            $_.name -eq "cloudflared-windows-amd64.exe"
          } | Select-Object -First 1
          if (-not $asset) {
            throw "The official cloudflared Windows binary was not found."
          }

          $cloudflaredPath = "$toolsRoot/cloudflared.exe"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $cloudflaredPath
          if ($asset.digest -and $asset.digest -match '^sha256:(.+)$') {
            $actualDigest = (Get-FileHash $cloudflaredPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualDigest -ne $Matches[1].ToLowerInvariant()) {
              throw "The downloaded cloudflared checksum is invalid."
            }
          }

          Copy-Item "pilot/*.ps1" $toolsRoot -Force
          Copy-Item "pilot/*.cmd" $toolsRoot -Force
          Copy-Item "pilot/README_RU.txt" $packageRoot -Force
          Copy-Item "installer/output/FleetSafetyManager_Office_Setup.exe" $packageRoot -Force
          Copy-Item "installer/output/FleetSafetyManager_Ship_Setup.exe" $packageRoot -Force

          @(
            "$toolsRoot/Start-FSM-Remote-Pilot.ps1",
            "$toolsRoot/Connect-FSM-Ship-Pilot.ps1",
            "$toolsRoot/Stop-FSM-Remote-Pilot.ps1",
            "$toolsRoot/cloudflared.exe",
            "$packageRoot/FleetSafetyManager_Office_Setup.exe",
            "$packageRoot/FleetSafetyManager_Ship_Setup.exe"
          ) | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Remote Pilot package is incomplete: $_" }
          }

          $startScript = Get-Content "$toolsRoot/Start-FSM-Remote-Pilot.ps1" -Raw
          $shipScript = Get-Content "$toolsRoot/Connect-FSM-Ship-Pilot.ps1" -Raw
          if ($startScript -notmatch 'trycloudflare\\.com' -or
              $startScript -notmatch 'Get-ActiveTunnelUrl' -or
              $startScript -notmatch [regex]::Escape('FleetSafetyManager_Ship_Setup*.exe') -or
              $shipScript -notmatch 'OfficeBaseUrl' -or
              $shipScript -notmatch 'AllowInsecureHttp') {
            throw "Remote Pilot zero-configuration scripts failed validation."
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: FleetSafetyManager-RC20-Windows-Installers
          path: |
            installer/output/FleetSafetyManager_Office_Setup.exe
            installer/output/FleetSafetyManager_Ship_Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload account-free remote pilot
        uses: actions/upload-artifact@v4
        with:
          name: FleetSafetyManager-RC20-Remote-Pilot
          path: pilot/output/FSM_Remote_Pilot
          if-no-files-found: error
          retention-days: 7
