name: Build FSM RC20 Windows Installers

on:
  workflow_dispatch:
  push:
    branches: [main, feature/ship-office-sync]
    paths:
      - "frontend/**"
      - "backend/**"
      - "installer/**"
      - "native/**"
      - "BUILD_RC20.ps1"
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Test backend role visibility
        shell: pwsh
        run: ./scripts/test-role-visibility.ps1

      - name: Build frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location frontend
          npm ci
          npm run build
          Set-Location ..

          $bundle = Get-Content "frontend/dist/assets/*.js" -Raw
          if ($bundle -notmatch "Version RC20") {
            throw "Frontend bundle does not contain Version RC20."
          }
          if ($bundle -notmatch "Synchronization completed") {
            throw "Frontend bundle does not contain the RC20 synchronization UI."
          }
          if ($bundle -notmatch "Add Vessel" -or
              $bundle -notmatch "Create Vessel") {
            throw "Frontend bundle does not contain the vessel creation UI."
          }
          if ($bundle -match "Version RC19") {
            throw "Frontend bundle still contains Version RC19."
          }

          $wwwroot = "backend/src/FSM.Api/wwwroot"
          if (Test-Path $wwwroot) { Remove-Item $wwwroot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $wwwroot | Out-Null
          Copy-Item "frontend/dist/*" $wwwroot -Recurse -Force

      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore backend/src/FSM.Api/FSM.Api.csproj
          dotnet publish backend/src/FSM.Api/FSM.Api.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=false `
            -o publish

          @("Data", "Data/SynchronizationTransfers", "Data/SynchronizationDownloads", "Documents/reports", "Documents/certificates", "Documents/service-requests", "Backups", "Logs") |
            ForEach-Object { New-Item -ItemType Directory -Force "publish/$_" | Out-Null }

          if (-not (Test-Path "publish/FSM.Api.exe")) {
            throw "FSM.Api.exe was not published."
          }

          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -NoProfile `
            -NonInteractive `
            -ExecutionPolicy Bypass `
            -File ".\native\scripts\build-launcher.ps1" `
            -OutputDirectory "publish"
          if ($LASTEXITCODE -ne 0 -or
              -not (Test-Path "publish/FleetSafetyManager.exe")) {
            throw "FleetSafetyManager.exe was not created."
          }

          $publishedBundle = Get-Content "publish/wwwroot/assets/*.js" -Raw
          if ($publishedBundle -notmatch "Add Vessel" -or
              $publishedBundle -notmatch "Create Vessel") {
            throw "Published application is missing the vessel creation UI."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Office installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyEdition=Office `
            /DOutputBase=FleetSafetyManager_RC20_Office_Setup `
            installer/FleetSafetyManager.iss

      - name: Build Ship installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyEdition=Ship `
            /DOutputBase=FleetSafetyManager_RC20_Ship_Setup `
            installer/FleetSafetyManager.iss

      - name: Verify installer files
        shell: pwsh
        run: |
          $office = "installer/output/FleetSafetyManager_RC20_Office_Setup.exe"
          $ship = "installer/output/FleetSafetyManager_RC20_Ship_Setup.exe"
          if (-not (Test-Path $office)) { throw "Office installer is missing." }
          if (-not (Test-Path $ship)) { throw "Ship installer is missing." }
          Get-FileHash $office -Algorithm SHA256
          Get-FileHash $ship -Algorithm SHA256

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: FleetSafetyManager-RC20-Windows-Installers
          path: installer/output/*.exe
          if-no-files-found: error
          retention-days: 30
