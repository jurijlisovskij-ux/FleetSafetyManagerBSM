name: Build FSM RC19 Windows Installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "installer/**"
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/apply-rc19-ui-fixes.mjs
          Set-Location frontend
          npm ci
          npm run build
          Set-Location ..

          $bundle = Get-Content "frontend/dist/assets/*.js" -Raw
          if ($bundle -notmatch "Version RC19") {
            throw "Frontend bundle does not contain Version RC19."
          }
          if ($bundle -match "Version RC18") {
            throw "Frontend bundle still contains Version RC18."
          }
          if ($bundle -notmatch "ship-edition") {
            throw "Frontend bundle does not contain Ship edition UI handling."
          }

          $wwwroot = "backend/src/FSM.Api/wwwroot"
          if (Test-Path $wwwroot) { Remove-Item $wwwroot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $wwwroot | Out-Null
          Copy-Item "frontend/dist/*" $wwwroot -Recurse -Force

      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore backend/src/FSM.Api/FSM.Api.csproj
          dotnet publish backend/src/FSM.Api/FSM.Api.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=false `
            -o publish

          @("Data", "Documents/reports", "Documents/certificates", "Backups", "Logs") |
            ForEach-Object { New-Item -ItemType Directory -Force "publish/$_" | Out-Null }

          if (-not (Test-Path "publish/FSM.Api.exe")) {
            throw "FSM.Api.exe was not published."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Office installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyEdition=Office `
            /DOutputBase=FleetSafetyManager_RC19_Office_Setup `
            installer/FleetSafetyManager.iss

      - name: Build Ship installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyEdition=Ship `
            /DOutputBase=FleetSafetyManager_RC19_Ship_Setup `
            installer/FleetSafetyManager.iss

      - name: Verify installer files
        shell: pwsh
        run: |
          $office = "installer/output/FleetSafetyManager_RC19_Office_Setup.exe"
          $ship = "installer/output/FleetSafetyManager_RC19_Ship_Setup.exe"
          if (-not (Test-Path $office)) { throw "Office installer is missing." }
          if (-not (Test-Path $ship)) { throw "Ship installer is missing." }
          Get-FileHash $office -Algorithm SHA256
          Get-FileHash $ship -Algorithm SHA256

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: FleetSafetyManager-RC19-Windows-Installers
          path: installer/output/*.exe
          if-no-files-found: error
          retention-days: 30
